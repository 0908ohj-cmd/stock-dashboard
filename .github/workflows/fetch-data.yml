name: 스냅샷 수집

# 정기 실행은 맥 launchd로 이관했다 — GitHub cron이 5~6시간 지연돼
# 장 마감 후 정시 수집이 불가능해졌다 (2026-09 측정: 예약 06:45 UTC → 실제 11:49 UTC).
# 여기 남은 workflow_dispatch는 맥이 멈췄을 때 손으로 돌리는 폴백이다.
# 10EMA 유니버스 빌드는 KRX 로그인(KRX_ID/KRX_PW)이 필요해 러너에서는 돌지 않는다.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: '수집 대상'
        type: choice
        options: [all, kr, us]
        default: all

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements-batch.txt

      - name: 스냅샷 수집
        run: python scripts/fetch_snapshot.py --markets ${{ inputs.markets }}

      - name: 커밋 & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: ${{ inputs.markets }} 스냅샷 $(date -u -d '+9 hours' +%F)"
          git pull --rebase origin main
          git push origin main
