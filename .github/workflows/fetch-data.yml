name: 스냅샷 수집

# 맥 launchd 배치가 1순위다. 이 워크플로는 로컬이 그 회차를 못 돌았을 때
# 이관 전과 똑같이(유니버스 빌드 + 스냅샷 수집) 대신 일하는 폴백이다.
#
#   시장  로컬(launchd)          폴백(이 워크플로, 예약)
#   KR    월~금 16:10 KST        월~금 16:50 KST  ('50 7 * * 1-5')
#   US    화~토 08:10 KST        화~토 08:50 KST  ('50 23 * * 1-5' — KST 08:50은
#                                                  UTC로 전날이라 요일이 월~금)
#
#   - 로컬 배치 소요 실측(2026-09-27 dry-run): KR 3분 37초, US 3분 27초. 같은
#     스크립트를 러너에서 돌린 과거 54회도 최대 KR 6.2분 / US 8.7분이었다. 그래서
#     로컬 시작 40분 뒤로 폴백을 예약한다.
#   - 예약 시각이 곧 발화 시각은 아니다. GitHub cron은 실측 3~6.5시간 늦게
#     뜬다(2026-09). 그래서 폴백 여부를 "수집 후 몇 시간"이 아니라 "로컬이 이번
#     회차를 돌았나"로 판정한다(scripts/check_snapshot_fresh.py). 지연이 하루를
#     넘지 않는 한 영향이 없고, 정시에 떠도 로컬이 먼저 끝나 있다.
#   - 로컬이 이미 돌았으면 의존성 설치 전에 빠진다(평소 15초 남짓).
#   - 폴백이 수집을 마친 뒤 커밋 직전에 원격을 다시 본다. 그 사이 로컬이 올렸으면
#     커밋을 버리고 끝낸다 — "(Action 폴백)"은 로컬이 정말 못 돌았을 때만 붙는다.
#     그래서 이 표시가 보이면 맥 배치가 죽어 있다는 뜻이다.
#
# 멱등성: 로컬과 폴백은 서로 다른 기계라 공유 락이 없다. 둘이 같은 날 같은 시장을
# 수집해 push가 엇갈려도, 늦게 올리는 쪽이 원격을 받은 뒤 스냅샷을 종목 단위로
# 병합해 올린다(scripts/lib_git_push.sh — git rebase는 한 줄 JSON에서 파일 전체가
# 충돌하므로 쓰지 않는다). 어느 쪽이 먼저든, 몇 번을 다시 돌려도 결과가 같다.
on:
  schedule:
    - cron: '50 7 * * 1-5'    # 16:50 KST 월~금 — KR 로컬 배치(16:10) 폴백
    - cron: '50 23 * * 1-5'   # 08:50 KST 화~토 — US 로컬 배치(08:10) 폴백
  workflow_dispatch:
    inputs:
      markets:
        description: '수집 대상'
        type: choice
        options: [all, kr, us]
        default: all

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 원격이 앞서 나갔을 때 병합 기준점(merge-base)을 찾으려면 이력이 필요하다
          fetch-depth: 0

      - name: 대상 시장 결정
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "markets=${{ inputs.markets }}" >> "$GITHUB_OUTPUT"
            echo "label=수동 실행" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 7 * * 1-5" ]; then
            echo "markets=kr" >> "$GITHUB_OUTPUT"
            echo "label=Action 폴백" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 23 * * 1-5" ]; then
            echo "markets=us" >> "$GITHUB_OUTPUT"
            echo "label=Action 폴백" >> "$GITHUB_OUTPUT"
          else
            # cron을 추가하고 이 분기를 안 고치면 조용히 엉뚱한 시장을 수집한다.
            # 묵묵히 넘기지 말고 실패시켜 드러낸다.
            echo "알 수 없는 트리거: schedule='${{ github.event.schedule }}'" >&2
            echo "cron을 추가했다면 이 분기도 함께 갱신할 것" >&2
            exit 1
          fi

      # 수동 실행(workflow_dispatch)에는 게이트를 걸지 않는다 — 손으로 돌렸다는
      # 것은 신선도와 무관하게 지금 수집하라는 뜻이다. 그때는 outputs.fresh가
      # 비어 있어 아래 스텝들이 모두 실행된다.
      - name: 로컬 배치가 이번 회차를 이미 수집했는지 확인
        id: gate
        if: github.event_name == 'schedule'
        run: python3 scripts/check_snapshot_fresh.py --markets ${{ steps.target.outputs.markets }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.fresh != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements-batch.txt
        if: steps.gate.outputs.fresh != 'true'

      # 이관 전과 같이 유니버스도 빌드한다. 실패해도 스냅샷 수집은 계속한다.
      # (FDR 경로는 KRX 로그인이 필요 없다. FDR이 KRX 장애로 404를 내면 pykrx로
      #  넘어가는데, 러너에는 KRX_ID/KRX_PW가 없어 그쪽도 실패한다 — 그 경우
      #  종목 목록만 전날 것으로 남고 시세는 채워진다.)
      - name: 국장 10EMA 유니버스 갱신
        if: steps.gate.outputs.fresh != 'true' && github.event_name == 'schedule' && steps.target.outputs.markets == 'kr'
        continue-on-error: true
        run: python scripts/build_kr_10ema_universe.py

      - name: 미장 10EMA 유니버스 갱신
        if: steps.gate.outputs.fresh != 'true' && github.event_name == 'schedule' && steps.target.outputs.markets == 'us'
        continue-on-error: true
        run: python scripts/build_us_growth_universe.py

      - name: 스냅샷 수집
        if: steps.gate.outputs.fresh != 'true'
        run: python scripts/fetch_snapshot.py --markets ${{ steps.target.outputs.markets }}

      # 수집하는 몇 분 사이 로컬이 늦게라도 올렸을 수 있다. 원격을 다시 보고,
      # 로컬이 이번 회차를 덮었으면 폴백 커밋을 버린다.
      - name: 그 사이 로컬이 올렸는지 다시 확인
        id: recheck
        if: steps.gate.outputs.fresh != 'true' && github.event_name == 'schedule'
        run: |
          git fetch --quiet origin main
          python3 scripts/check_snapshot_fresh.py --markets ${{ steps.target.outputs.markets }} --ref origin/main

      - name: 커밋 & push
        if: steps.gate.outputs.fresh != 'true' && steps.recheck.outputs.fresh != 'true'
        env:
          PYTHON: python   # 병합 스크립트를 의존성이 깔린 인터프리터로 돌린다
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv data/saved/us_10ema.tickers data/saved/kosdaq_10ema.tickers data/saved/kospi_10ema.tickers
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: ${{ steps.target.outputs.markets }} 스냅샷 $(date -u -d '+9 hours' +%F) (${{ steps.target.outputs.label }})"
          . scripts/lib_git_push.sh
          sync_and_push
